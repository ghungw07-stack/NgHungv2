server {
    listen 80;
    listen [::]:80;
    server_name hungdz.id.vn www.hungdz.id.vn;

    root /var/www/hungdz.id.vn;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}

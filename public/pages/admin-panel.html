<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NgHung - Zalo Bot </title>
    <link rel="stylesheet" href="/styles/base/main.css" />
    <link rel="stylesheet" href="/styles/base/theme.css" />
    <link rel="stylesheet" href="/styles/pages/admin-panel.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap"
      rel="stylesheet"
    />
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
  </head>
  <body>
    <div class="menu-toggle" id="menuToggle">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>
    <div class="color-change" id="colorChange">
      <i class="fas fa-palette"></i>
    </div>
    <nav class="side-menu" id="sideMenu"></nav>
    <div class="parallax-conta
      <header>
        <div class="inner">
          <div class="main">
            <h2 class="title">NgHung - Zalo Bot</h2>
          </div>
        </div>
      </header>
      <main>
        <div class="admin-toolbar">
          <div class="toolbar-row">
            <div class="search-wrap">
              <input type="text" id="botSearch" placeholder="Tìm bot theo tên hoặc ID..." />
            </div>
            <button id="refreshBotsBtn" class="icon-btn" title="Làm mới danh sách">
              <i class="fas fa-rotate"></i>
            </button>
          </div>
          <div class="toolbar-meta">
            <span id="botCount" class="bot-count">0 bot</span>
          </div>
        </div>
        <div class="grid-container">
          <section class="grid-item bot-list">
            <h2>Danh sách Bot</h2>
            <div class="bot-list-container" id="botListContainer">
              <div class="skeleton-list">
                <div class="skeleton-item"></div>
                <div class="skeleton-item"></div>
                <div class="skeleton-item"></div>
              </div>
            </div>
          </section>

          <section class="grid-item bot-info">
            <h2>Thông tin Bot</h2>
            <div class="bot-info-container" id="botInfoContainer">
              <div class="empty-state">
                <div class="empty-title">Chưa chọn bot</div>
                <div class="empty-sub">Vui lòng chọn một bot ở danh sách bên trái.</div>
              </div>
            </div>
          </section>

        </div>
      </main>
      <footer>
        <div class="ticker">
          <div class="inner-footer">
            <span class="ticker-content"></span>
          </div>
        </div>
      </footer>
    </div>

    <!-- Bottom sheet tác vụ bot (thay cho dropdown menu cũ) -->
    <div id="actionSheet" class="action-sheet">
      <div class="action-sheet-backdrop" id="actionSheetBackdrop"></div>
      <div class="action-sheet-panel">
        <div class="action-sheet-handle"></div>
        <div class="action-sheet-header" id="actionSheetHeader">Tác vụ</div>
        <div class="action-sheet-body" id="actionSheetBody"></div>
      </div>
    </div>

    <!-- Popup xác nhận hành động -->
    <div id="confirmDialog" class="popup" style="display: none">
      <div class="popup-content">
        <h2 id="confirmTitle">Xác nhận</h2>
        <p id="confirmMessage"></p>
        <div class="confirm-buttons">
          <button id="confirmYes">Đồng ý</button>
          <button id="confirmNo">Hủy</button>
        </div>
      </div>
    </div>
    <script src="/scripts/core/colorChanger.js"></script>
    <script src="/scripts/core/menuHandler.js"></script>
    <script src="/scripts/core/common.js"></script>
    <script src="/scripts/core/theme.js"></script>
    <script src="/scripts/pages/admin-panel.js"></script>
    <script src="/scripts/components/sideMenu.js"></script>
  </body>
</html>

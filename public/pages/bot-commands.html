<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Danh Sách Lệnh - HHH Zalo Bot</title>
    <link rel="stylesheet" href="/styles/base/main.css" />
    <link rel="stylesheet" href="/styles/base/theme.css" />
    <link rel="stylesheet" href="/styles/base/header.css" />
    <link rel="stylesheet" href="/styles/base/body.css" />
    <link rel="stylesheet" href="/styles/base/footer.css" />
    <link rel="stylesheet" href="/styles/pages/bot-commands.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
    <script src="/socket.io/socket.io.js"></script>
    <script src="/scripts/core/config.js"></script>
  </head>
  <body>
    <div class="menu-toggle" id="menuToggle">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>

    <div class="color-change" id="colorChange">
      <i class="fas fa-palette"></i>
    </div>

    <nav class="side-menu" id="sideMenu"></nav>

    <header>
      <div class="inner">
        <div class="main">
          <h2 class="title">Danh Sách Lệnh</h2>
        </div>
      </div>
    </header>

    <main>
      <div class="grid-item commands admin-commands">
        <div class="search-container">
          <input type="text" id="adminCommandSearch" placeholder="Tìm kiếm lệnh..." />
          <i class="fas fa-search search-icon"></i>
        </div>
        <div class="commands-scroll-container">
          <div id="adminCommandList" class="command-list"></div>
        </div>
      </div>
    </main>

    <script src="/scripts/core/menuHandler.js"></script>
    <script src="/scripts/core/colorChanger.js"></script>
    <script src="/scripts/core/common.js"></script>
    <script src="/scripts/core/theme.js"></script>
    <script src="/scripts/pages/admin-panel.js"></script>
    <script src="/scripts/components/sideMenu.js"></script>
    <script src="/scripts/pages/bot-commands/commands.js"></script>
  </body>
</html>
